name: Build Full APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish to GitHub Releases'
        type: boolean
        default: true
      tag:
        description: 'Release tag (e.g. v0.1.6; defaults to v<peanuts/VERSION>)'
        type: string
        required: false
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Peanuts Native APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.114'

      - name: Set up Python & fontTools
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh cmake ninja-build
          pip install fonttools

      - name: Install SDK Platform 36 & NDK 28.2.13676358
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build on-device packer stage
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          ./peanuts/scripts/ondevice-stage.sh "$RUNNER_TEMP/nxpack-work"

      - name: Build Full APK
        env:
          NX_SIGN_STORE_BASE64: ${{ secrets.NX_SIGN_STORE_BASE64 }}
          NX_SIGN_ALIAS: ${{ secrets.NX_SIGN_ALIAS }}
          NX_SIGN_PASS: ${{ secrets.NX_SIGN_PASS }}
        run: |
          NX_GAMES=$(tr '\n' ',' < peanuts/release-titles.txt | sed 's/,$//')
          NX_VERSION=$(tr -d '[:space:]' < peanuts/VERSION)
          export NX_SIGN_STORE="$RUNNER_TEMP/release.jks"
          USE_GENERATED_KEY=1
          if [ -n "$NX_SIGN_STORE_BASE64" ] && [ -n "$NX_SIGN_ALIAS" ] && [ -n "$NX_SIGN_PASS" ]; then
            printf '%s' "$NX_SIGN_STORE_BASE64" | tr -d '[:space:]' | base64 -d > "$NX_SIGN_STORE" || true
            if KEYTOOL_OUT=$(keytool -list -keystore "$NX_SIGN_STORE" -storepass "$NX_SIGN_PASS" -alias "$NX_SIGN_ALIAS" 2>&1); then
              echo "::notice::Using release keystore from GitHub Secrets"
              USE_GENERATED_KEY=0
            else
              echo "::warning::Secret keystore check failed (${KEYTOOL_OUT//$'\n'/ }); falling back to generated release keystore"
              rm -f "$NX_SIGN_STORE"
            fi
          fi
          if [ "$USE_GENERATED_KEY" -eq 1 ]; then
            echo "::notice::Generating release keystore"
            export NX_SIGN_ALIAS="peanuts"
            export NX_SIGN_PASS="peanutsnative123"
            keytool -genkeypair -v \
              -keystore "$NX_SIGN_STORE" \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$NX_SIGN_ALIAS" \
              -storepass "$NX_SIGN_PASS" \
              -dname "CN=Peanuts Native, OU=Android, O=Peanuts, L=City, S=State, C=US"
          fi
          cd android/app
          ./gradlew apk \
            -PnxApp=peanuts \
            -PnxAppId=peanutsx \
            -PnxLabel="Peanuts Native" \
            -PnxRelease=true \
            -PnxRequireSeeds=false \
            -PnxVersion="$NX_VERSION" \
            -PnxGames="$NX_GAMES" \
            -PnxPackStage="$RUNNER_TEMP/nxpack-work/stage"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: peanuts-native-apk
          path: android/app/out/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v$(tr -d '[:space:]' < peanuts/VERSION)"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" android/app/out/*.apk --clobber
          else
            gh release create "$TAG" android/app/out/*.apk --title "$TAG" --generate-notes
          fi