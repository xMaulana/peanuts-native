name: Build Full APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Peanuts Native APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.114'

      - name: Set up Python & fontTools
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh cmake ninja-build
          pip install fonttools

      - name: Install SDK Platform 36 & NDK 28.2.13676358
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build on-device packer stage
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          ./peanuts/scripts/ondevice-stage.sh "$RUNNER_TEMP/nxpack-work"

      - name: Build Full APK
        run: |
          NX_GAMES=$(tr '\n' ',' < peanuts/release-titles.txt | sed 's/,$//')
          cd android/app
          ./gradlew apk \
            -PnxApp=peanuts \
            -PnxLabel="Peanuts Native" \
            -PnxGames="$NX_GAMES" \
            -PnxPackStage="$RUNNER_TEMP/nxpack-work/stage"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: peanuts-native-apk
          path: android/app/out/*.apk